[project]
name = "atri-bot"
version = "1.2.4"
description = "一个叫ATRI的qq机器人"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp[speedups]>=3.13.3",
    "mcp>=1.26.0",
    "openai>=1.82.0",
    "fastapi>=0.115",
    "aiomysql>=0.3.0",
    "websockets>=15.0.1",
    "bs4>=0.0.2",
    "psutil>=7.0.0",
    "pyahocorasick>=2.2.0",
    "bilibili-api-python>=17.3.0",
    "asyncpg>=0.30.0",
    "docker>=7.1.0",
    "croniter>=6.0.0",
    "trafilatura>=2.0.0",
    "strictyaml>=1.7.3",
    "pillow>=12.1.0",
    "numpy>=2.4.2",
    "json-repair>=0.58.3",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = [
    "document",
    "test.py"
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E701"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.workspace]
members = [
    "abandoned/MCP_test/mcp-client",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
