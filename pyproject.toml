[project]
name = "atri-bot"
version = "1.2.4"
description = "一个叫ATRI的qq机器人"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp[speedups]>=3.13.3",
    "mcp>=1.23.0",
    "openai>=1.82.0",
    "pymilvus>=2.6.0",
    "fastapi>=0.115",
    "aiomysql>=0.3.0",
    "websockets>=15.0.1",
    "bs4>=0.0.2",
    "psutil>=7.0.0",
    "pyahocorasick>=2.2.0",
    "bilibili-api-python>=17.3.0",
    "asyncpg>=0.30.0",
    "docker>=7.1.0",
    "croniter>=6.0.0",
    "trafilatura>=2.0.0",
    "strictyaml>=1.7.3",
]

[tool.uv.workspace]
members = [
    "abandoned/MCP_test/mcp-client",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
