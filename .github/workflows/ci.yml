name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements-linux.txt

      - name: Install Project and Test Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-linux.txt pytest pytest-asyncio ruff

      - name: Run Ruff
        run: ruff check .

      - name: Compile Python sources
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m compileall main.py atribot tests
        
      - name: Run Pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest

  windows-install-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements-windows.txt

      - name: Install Project and Test Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt pytest pytest-asyncio ruff

      - name: Run Ruff
        run: ruff check .

      - name: Compile Python sources
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m compileall main.py atribot tests

      - name: Run Pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest
